name: Apply Rondo v0.3.1 user-test release

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .release-v031/READY

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Verify, apply, and validate release
        shell: bash
        run: |
          set -euo pipefail
          cat .release-v031/patch.part-* | base64 -d | gzip -d > /tmp/rondo-v031.patch
          echo "ebc77be5404edbff5e14d0d5b44aced72effeafa07fda978cb4846321e663044  /tmp/rondo-v031.patch" | sha256sum -c -
          git apply --check /tmp/rondo-v031.patch
          git apply /tmp/rondo-v031.patch
          test -f tests/user-ready.mjs
          test "$(node -p "require('./package.json').version")" = "0.3.1"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.1"
          npm run check
          npm run test:unit

      - name: Commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-v031 .github/workflows/apply-rondo-v031.yml
          git add -A
          git diff --cached --check
          cat > /tmp/expected-product-files <<'EOF'
          README.md
          docs/DESIGN.md
          index.html
          package-lock.json
          package.json
          song-room.css
          src/app.js
          tests/user-ready.mjs
          EOF
          git diff --cached --name-only | grep -Ev '^(\.release-v031/|\.github/workflows/apply-rondo-v031\.yml)$' | LC_ALL=C sort > /tmp/actual-product-files
          diff -u /tmp/expected-product-files /tmp/actual-product-files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rondo v0.3.1: user-test polish"
          git push origin HEAD:rondo-v031-user-ready
