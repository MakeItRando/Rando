name: Clean v0.3.1 preview branch

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .preview-cleanup-trigger

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -f --ignore-unmatch \
            .pages-debug-trigger \
            .pages-debug \
            .live-preview-trigger \
            .live-preview \
            .preview-test-trigger \
            .preview-validation \
            .preview-cleanup-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove preview branch diagnostics"
          git push
