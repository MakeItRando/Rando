name: Apply Rondo v0.3 release

on:
  push:
    branches:
      - rondo-v23-song-room
    paths:
      - .release-v030/READY

permissions:
  contents: write

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack source bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release-v030/bundle.b64 > /tmp/rondo-v030-text.tar.gz
          echo "$(cat .release-v030/SHA256)  /tmp/rondo-v030-text.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/rondo-v030-text.tar.gz -C .
      - name: Generate authorized Rondo Originals
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet numpy==2.2.6
          python3 scripts/generate-demo-audio.py
          for file in assets/audio/*.mp3; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=noprint_wrappers=1 "$file"
          done
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check
          npm run test:unit
          npm run build:preview
      - name: Commit assembled release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-v030
          rm -f .github/workflows/apply-rondo-v030.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rondo v0.3: Song Room and authorized audio"
          git push origin HEAD:rondo-v23-song-room
