name: Rondo user-ready QA

on:
  push:
    branches: [rondo-v031-user-ready]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rondo-user-ready-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RONDO_URL: http://127.0.0.1:4173/preview-test.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Build portable preview
        run: npm run build:preview
      - name: Start preview server
        run: |
          python3 -m http.server 4173 > /tmp/rondo-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/preview-test.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rondo-server.log
          exit 1
      - name: Run static and unit checks
        run: npm run check && npm run test:unit
      - name: Test app smoke paths
        run: node tests/smoke.mjs
      - name: Test interface quality
        run: |
          set +e
          output=$(node tests/quality.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                printf '::error title=Interface quality::%s\n' "$line"
              fi
            done <<< "$output"
            exit "$status"
          fi
      - name: Test Discover and Journey routes
        run: node tests/discovery-hub.mjs
      - name: Test listening flow
        run: node tests/listening.mjs
      - name: Test Song Room
        run: node tests/song-room.mjs
      - name: Test audio behavior
        run: node tests/audio.mjs
      - name: Test personal surfaces
        run: node tests/personal.mjs
      - name: Test user-ready flow
        run: node tests/user-ready.mjs
      - name: Test experience details
        run: node tests/experience.mjs
      - name: Test full concept flow
        run: node tests/full-concept.mjs
      - name: Test release readiness
        run: node tests/release-ready.mjs
      - name: Capture visual QA
        run: node scripts/capture-visuals.mjs
      - name: Publish portable preview
        run: |
          test -s preview.html
          git fetch origin rondo-v031-preview
          rm -rf /tmp/rondo-preview
          git worktree add /tmp/rondo-preview origin/rondo-v031-preview
          cd /tmp/rondo-preview
          git switch -C rondo-v031-preview
          cp "$GITHUB_WORKSPACE/preview.html" rondo-v031-preview.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rondo-v031-preview.html
          if git diff --cached --quiet; then
            echo 'Portable preview is already current.'
            exit 0
          fi
          git commit -m 'preview: publish v0.3.2 candidate'
          git push origin HEAD:rondo-v031-preview
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rondo-visual-qa-${{ github.run_number }}
          path: .qa/
          if-no-files-found: ignore
          retention-days: 14
