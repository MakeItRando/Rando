name: Combine v0.3.1 source bundle

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .source-combine-trigger

permissions:
  contents: write

jobs:
  combine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combine export parts
        shell: bash
        run: |
          set -euo pipefail
          cat .source-export/part-* > .source-export/source.tar.xz.b64
          test "$(wc -c < .source-export/source.tar.xz.b64)" = "94000"
          git add -f .source-export/source.tar.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: combine final-polish source bundle"
          git push
