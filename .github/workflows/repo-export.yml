name: Temporary repository export

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .repo-export-trigger

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source for local QA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-export
          mkdir -p .repo-export
          tar \
            --exclude=.git \
            --exclude=.repo-export \
            --exclude=.release-v031 \
            --exclude=.qa-output \
            --exclude=.qa-temp \
            --exclude=.github/workflows/repo-export.yml \
            --exclude=.github/workflows/qa-audit.yml \
            --exclude=.repo-export-trigger \
            --exclude=.qa-trigger \
            --exclude='assets/audio/*.mp3' \
            -cf .repo-export/rondo-source.tar .
          sha256sum .repo-export/rondo-source.tar > .repo-export/SHA256SUMS
          tar -tf .repo-export/rondo-source.tar > .repo-export/MANIFEST.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .repo-export
          git commit -m "chore: export local QA source bundle"
          git push
