name: Apply Rondo full concept
# Retry 2: verified transfer chunks.

on:
  push:
    branches: [rondo-v031-user-ready]
    paths: [.github/workflows/apply-full-concept.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH_NAME: rondo-v031-user-ready

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Reconstruct and apply reviewed patch
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 624b0363feac01b977d0b0f5bb772748a6aadc22 HEAD
          cat .concept-transfer/part-* | tr -d '\n' | base64 --decode > /tmp/rondo-full-concept.patch.xz
          echo 'e1aded100b95feea12f653c7d0d087c611544d6ab084b920b0b9e9d3bab18c95  /tmp/rondo-full-concept.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/rondo-full-concept.patch.xz > /tmp/rondo-full-concept.patch
          git apply --check /tmp/rondo-full-concept.patch
          git apply /tmp/rondo-full-concept.patch
          git diff --check

      - name: Install dependencies
        run: |
          set -euxo pipefail
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Run complete release gate
        run: |
          set -euxo pipefail
          npm run check
          npm run test:unit
          npm run build:preview
          python3 -m http.server 4173 > /tmp/rondo-server.log 2>&1 &
          echo $! > /tmp/rondo-server.pid
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          RONDO_URL=http://127.0.0.1:4173/index.html npm run test:browser 2>&1 | tee /tmp/rondo-browser.log
          RONDO_URL=http://127.0.0.1:4173/index.html node tests/capture-final.mjs
          git diff --check

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: rondo-full-concept-qa
          path: .qa/
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated candidate and self-clean
        run: |
          set -euxo pipefail
          rm -rf .concept-transfer .qa .preview preview.html preview-test.html
          rm -f .github/workflows/apply-full-concept.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete full-concept listening experience'
          git push origin HEAD:rondo-v031-user-ready

      - name: Record failure for inspection
        if: failure()
        run: |
          set +e
          mkdir -p .concept-transfer
          {
            echo '# Full-concept gate failure'
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo
            echo '## Browser log'
            echo '```text'
            tail -n 160 /tmp/rondo-browser.log 2>/dev/null || true
            tail -n 80 /tmp/rondo-server.log 2>/dev/null || true
            echo '```'
          } > .concept-transfer/FAILURE.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .concept-transfer/FAILURE.md
          git commit -m 'chore: record full-concept gate failure' || true
          git push origin HEAD:rondo-v031-user-ready || true
