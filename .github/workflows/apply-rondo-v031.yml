name: Apply Rondo v0.3.1 product files

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .release-v031/READY

permissions:
  contents: write

jobs:
  apply-product:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Apply and commit validated product files
        shell: bash
        run: |
          set -euo pipefail
          cat .release-v031/patch.part-* | base64 -d | gzip -d > /tmp/rondo-v031.patch
          echo "ebc77be5404edbff5e14d0d5b44aced72effeafa07fda978cb4846321e663044  /tmp/rondo-v031.patch" | sha256sum -c -
          git apply --check /tmp/rondo-v031.patch
          git apply /tmp/rondo-v031.patch
          test -f tests/user-ready.mjs
          test "$(node -p "require('./package.json').version")" = "0.3.1"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.1"
          npm run check
          npm run test:unit
          git add README.md docs/DESIGN.md index.html package-lock.json package.json song-room.css src/app.js tests/user-ready.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rondo v0.3.1: user-test polish"
          git push origin HEAD:rondo-v031-user-ready
