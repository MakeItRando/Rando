name: Clean v0.3.1 preview diagnostics

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .cleanup-trigger

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Remove temporary preview files
        shell: bash
        run: |
          set -euo pipefail
          git rm -r -f --ignore-unmatch \
            .pages-debug-trigger \
            .pages-debug \
            .live-preview-trigger \
            .live-preview \
            rondo-v031-preview.html \
            .cleanup-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove preview diagnostics"
          git push
