name: Final mobile Library action QA

on:
  push:
    branches: [rondo-v031-user-ready]
    paths:
      - .github/workflows/final-mobile-library-target.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            browser="$(command -v chromium || command -v chromium-browser)"
          fi
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
      - name: Patch and run complete release gate
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          css = css_path.read_text()
          marker = '/* Final mobile Library action target */'
          if marker in css:
              raise SystemExit('Mobile Library target patch already present')
          css_path.write_text(css.rstrip() + '\n\n\n' + marker + '\n@media (max-width: 760px) {\n  .empty-library-copy .primary-action { min-height: 44px; }\n}\n')

          test_path = Path('tests/release-ready.mjs')
          test = test_path.read_text()
          anchor = "      assert(await contrastFor(mobile.locator('.empty-library-copy p')) >= 4.5, 'Empty Library guidance should meet normal-text contrast.');"
          addition = anchor + "\n      const discoveryTarget = await mobile.locator('.empty-library-copy [data-return-discover]').boundingBox();\n      assert(discoveryTarget && discoveryTarget.width >= 44 && discoveryTarget.height >= 44, 'Empty Library discovery action should meet a 44px mobile target.');"
          if test.count(anchor) != 1:
              raise SystemExit('Mobile Library regression anchor not found exactly once')
          test_path.write_text(test.replace(anchor, addition, 1))
          PY
          npm ci
          mkdir -p .qa
          npm audit --json > .qa/npm-audit.json
          node -e "const a=JSON.parse(require('node:fs').readFileSync('.qa/npm-audit.json')); if(a.metadata.vulnerabilities.total) throw new Error('Audit findings remain')"
          npm run build:preview
          python3 -m http.server 4173 > /tmp/rondo-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null
          npm test
          node tests/capture-final.mjs
          test "$(find .qa -maxdepth 1 -name '*.png' | wc -l)" -eq 8
          git diff --check
          rm -f .github/workflows/final-mobile-library-target.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore mobile Library action target"
          git push origin HEAD:rondo-v031-user-ready
