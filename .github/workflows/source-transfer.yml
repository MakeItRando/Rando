name: Stage v0.3.1 source transfer

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .source-transfer-trigger

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand transfer container
        shell: bash
        run: |
          set -euo pipefail
          src=.source-export/source.tar.xz.b64
          out=.source-export/source.transfer.txt
          test "$(wc -c < "$src")" = "94000"
          cat "$src" "$src" "$src" "$src" > "$out"
          test "$(wc -c < "$out")" = "376000"
          git add -f "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stage final-polish source transfer"
          git push
