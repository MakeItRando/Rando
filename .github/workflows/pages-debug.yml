name: Temporary Pages diagnostic

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .pages-debug-trigger

permissions:
  contents: write
  pages: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Inspect and attempt Pages enablement
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p .pages-debug
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          request() {
            local method="$1"
            local output="$2"
            shift 2
            curl --silent --show-error \
              --request "$method" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$@" \
              --write-out "\nHTTP_STATUS:%{http_code}\n" \
              "$API" > "$output"
          }
          request GET .pages-debug/before.txt
          BEFORE_STATUS="$(sed -n 's/^HTTP_STATUS://p' .pages-debug/before.txt | tail -1)"
          if [ "$BEFORE_STATUS" = "404" ]; then
            request POST .pages-debug/enable.txt --header "Content-Type: application/json" --data '{"build_type":"workflow"}'
          else
            request PUT .pages-debug/enable.txt --header "Content-Type: application/json" --data '{"build_type":"workflow"}'
          fi
          request GET .pages-debug/after.txt
          exit 0

      - name: Preserve Pages diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -f .pages-debug
          if git diff --cached --quiet; then
            echo "Pages diagnostic is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record Pages diagnostic"
          git push
