name: Finish Rondo user experience

on:
  push:
    branches: [rondo-v031-user-ready]

permissions:
  contents: write

concurrency:
  group: rondo-final-ux-finish
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final interaction and copy pass
        run: node scripts/apply-ux-finish.mjs
      - name: Build deterministic preview
        run: npm run build:preview
      - name: Run complete release gate
        env:
          RONDO_URL: file://${{ github.workspace }}/preview-test.html
        run: npm test
      - name: Capture final visual states
        run: node tests/capture-final.mjs
      - name: Publish tested source and QA captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package.json index.html styles.css src/app.js src/ui/views.js src/ui/songRoom.js tests/experience.mjs tests/capture-final.mjs .qa/*.png
          git rm .github/workflows/final-ux-finish.yml scripts/apply-ux-finish.mjs
          git commit -m "feat: finish Rondo listening experience"
          git push origin HEAD:rondo-v031-user-ready
