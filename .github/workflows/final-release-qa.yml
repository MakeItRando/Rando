name: Final release QA

on:
  push:
    branches: [rondo-v031-user-ready]
    paths:
      - .github/workflows/final-release-qa.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            browser="$(command -v chromium || command -v chromium-browser)"
          fi
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run final gate
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p .qa
          set +e
          (
            set -e
            echo '== APPLY RELEASE FIXES =='
            python3 - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          css = css_path.read_text()
          old_target = "  .artist-actions .text-action { grid-column: 1 / -1; grid-row: 2; justify-self: start; width: max-content; min-width: 44px; min-height: 32px; }"
          new_target = "  .artist-actions .text-action { grid-column: 1 / -1; grid-row: 2; justify-self: start; width: max-content; min-width: 44px; min-height: 44px; }"
          if old_target not in css:
              raise SystemExit('Mobile skip target anchor not found')
          css_path.write_text(css.replace(old_target, new_target, 1))

          app_path = Path('src/app.js')
          app = app_path.read_text()
          old_binding = "  $('previewCompletion').addEventListener('click', openCompletion);"
          new_binding = "  $('previewCompletion')?.addEventListener('click', openCompletion);"
          if old_binding not in app:
              raise SystemExit('Preview control binding anchor not found')
          app_path.write_text(app.replace(old_binding, new_binding, 1))

          smoke_path = Path('tests/smoke.mjs')
          smoke = smoke_path.read_text()
          old_assertion = "  if (await page.locator('.track-row').count() !== 7) throw new Error('Matching catalog should contain seven Kairo tracks');"
          new_assertion = """  await page.waitForTimeout(300);
            const initialTrackCount = await page.locator('.track-row').count();
            if (initialTrackCount !== 7) throw new Error('Matching catalog should contain seven Kairo tracks; got ' + initialTrackCount + '; browser errors: ' + errors.join(' | '));"""
          if old_assertion not in smoke:
              raise SystemExit('Startup assertion anchor not found')
          smoke = smoke.replace(old_assertion, new_assertion, 1)
          old_completion = """  await page.click('#previewCompletion');
            if (await page.locator('#completionOverlay').evaluate((node) => node.hidden)) throw new Error('Completion dialog did not open');"""
          new_completion = """  for (let attempts = 0; attempts < 12 && await page.locator('#completionOverlay').evaluate((node) => node.hidden); attempts += 1) {
              await page.click('#nextTrack');
            }
            if (await page.locator('#completionOverlay').evaluate((node) => node.hidden)) throw new Error('Completion dialog did not open through the real end-of-artist path');"""
          if old_completion not in smoke:
              raise SystemExit('Completion assertion anchor not found')
          smoke_path.write_text(smoke.replace(old_completion, new_completion, 1))
          PY
            echo '== UPDATE PLAYWRIGHT =='
            npm install --save-dev playwright@1.63.0 --ignore-scripts
            echo '== AUDIT =='
            npm audit --json > .qa/npm-audit.json
            node -e "const a=JSON.parse(require('node:fs').readFileSync('.qa/npm-audit.json')); if(a.metadata.vulnerabilities.total) throw new Error('Audit findings remain')"
            echo '== BUILD =='
            npm run build:preview
            echo '== START PREVIEW SERVER =='
            python3 -m http.server 4173 > /tmp/rondo-preview.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null
            echo '== TEST =='
            npm test
            echo '== CAPTURE =='
            node tests/capture-final.mjs
            test "$(find .qa -maxdepth 1 -name '*.png' | wc -l)" -eq 8
            echo '== DIFF CHECK =='
            git diff --check
          ) > .qa/final-release.log 2>&1
          status=$?
          cat .qa/final-release.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add .qa/final-release.log
            git commit -m "chore: capture final release QA failure" || true
            git push origin HEAD:rondo-v031-user-ready || true
            exit "$status"
          fi
          rm -f .github/workflows/final-release-qa.yml .qa/final-release.log
          git add -A
          git diff --cached --quiet || git commit -m "chore: verify responsive release candidate"
          git push origin HEAD:rondo-v031-user-ready
