name: Validate portable v0.3.1 preview

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .preview-test-trigger

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Validate live preview
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .preview-validation
          CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const previewUrl = 'https://htmlpreview.github.io/?https://raw.githubusercontent.com/MakeItRando/Rando/rondo-v031-preview/rondo-v031-preview.html';
          const result = {
            previewUrl,
            passed: false,
            desktop: {},
            mobile: {},
            pageErrors: [],
            consoleErrors: [],
            httpFailures: [],
            requestFailures: [],
            validationErrors: []
          };
          const watch = (page, label) => {
            page.on('pageerror', (error) => result.pageErrors.push(`${label}: ${error.message}`));
            page.on('console', (message) => { if (message.type() === 'error') result.consoleErrors.push(`${label}: ${message.text()}`); });
            page.on('response', (response) => { if (response.status() >= 400) result.httpFailures.push({ label, status: response.status(), url: response.url() }); });
            page.on('requestfailed', (request) => result.requestFailures.push({ label, url: request.url(), error: request.failure()?.errorText || 'unknown' }));
          };
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROMIUM_PATH, args: ['--no-sandbox'] });
          try {
            const desktop = await browser.newPage({ viewport: { width: 1440, height: 960 } });
            watch(desktop, 'desktop');
            const response = await desktop.goto(previewUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await desktop.locator('#artistName').waitFor({ state: 'visible', timeout: 60000 });
            result.desktop = {
              status: response?.status() ?? null,
              finalUrl: desktop.url(),
              title: await desktop.title(),
              artistName: (await desktop.locator('#artistName').innerText()).trim(),
              trackRows: await desktop.locator('.track-row').count(),
              bodyWidth: await desktop.evaluate(() => document.body.scrollWidth),
              viewportWidth: await desktop.evaluate(() => document.documentElement.clientWidth)
            };
            await desktop.locator('.rail-button[data-view="library"]').click();
            await desktop.locator('.rail-button[data-view="discover"]').click();
            await desktop.locator('.track-play').first().click();
            await desktop.waitForTimeout(1500);
            result.desktop.audio = await desktop.evaluate(() => {
              const audio = document.querySelector('audio');
              return audio ? {
                currentSrc: audio.currentSrc,
                readyState: audio.readyState,
                networkState: audio.networkState,
                errorCode: audio.error?.code ?? null
              } : null;
            });
            await desktop.locator('#openFullPlayer').click();
            await desktop.locator('.song-room-tabs [data-song-room-mode="lyrics"]').click();
            result.desktop.songRoomVisible = await desktop.locator('#fullPlayer').isVisible();
            result.desktop.lyricsSelected = await desktop.locator('.song-room-tabs [data-song-room-mode="lyrics"]').getAttribute('aria-selected');
            await desktop.close();

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            watch(mobile, 'mobile');
            await mobile.goto(previewUrl, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await mobile.locator('#artistName').waitFor({ state: 'visible', timeout: 60000 });
            await mobile.locator('.mobile-nav-button[data-mobile-view="library"]').click();
            await mobile.locator('.mobile-nav-button[data-mobile-view="journeys"]').click();
            await mobile.locator('.mobile-nav-button[data-mobile-view="profile"]').click();
            await mobile.locator('.mobile-nav-button[data-mobile-view="discover"]').click();
            await mobile.locator('#mobileDirectoryButton').click();
            result.mobile = {
              artistName: (await mobile.locator('#artistName').innerText()).trim(),
              directoryVisible: await mobile.locator('#directory').isVisible(),
              focusedId: await mobile.evaluate(() => document.activeElement?.id || ''),
              bodyWidth: await mobile.evaluate(() => document.body.scrollWidth),
              viewportWidth: await mobile.evaluate(() => document.documentElement.clientWidth)
            };
            await mobile.locator('#directoryScrim').click({ position: { x: 10, y: 10 } });
            await mobile.waitForFunction(() => document.querySelector('#directory')?.getAttribute('aria-hidden') === 'true', null, { timeout: 3000 });
            result.mobile.directoryDismissed = true;
            await mobile.close();

            result.passed = result.desktop.title.includes('Rondo')
              && Boolean(result.desktop.artistName)
              && result.desktop.trackRows > 0
              && result.desktop.songRoomVisible
              && result.desktop.lyricsSelected === 'true'
              && result.desktop.bodyWidth <= result.desktop.viewportWidth
              && result.desktop.audio?.currentSrc.includes('/assets/audio/')
              && result.desktop.audio?.errorCode === null
              && Boolean(result.mobile.artistName)
              && result.mobile.directoryVisible
              && result.mobile.focusedId === 'closeDirectory'
              && result.mobile.directoryDismissed
              && result.mobile.bodyWidth <= result.mobile.viewportWidth
              && result.pageErrors.length === 0
              && result.httpFailures.length === 0
              && result.requestFailures.length === 0;
          } catch (error) {
            result.validationErrors.push(error.stack || error.message);
          } finally {
            await browser.close();
            writeFileSync('.preview-validation/result.json', `${JSON.stringify(result, null, 2)}\n`);
          }
          if (!result.passed) process.exit(1);
          NODE
      - name: Preserve validation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -f .preview-validation/result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record portable preview validation"
          git push
      - name: Enforce validation
        if: steps.validate.outcome != 'success'
        run: exit 1
