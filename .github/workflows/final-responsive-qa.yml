name: Final responsive QA

on:
  push:
    branches: [rondo-v031-user-ready]
    paths:
      - .github/workflows/final-responsive-qa.yml
      - scripts/run-final-responsive-qa.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            browser="$(command -v chromium || command -v chromium-browser)"
          fi
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"

      - name: Apply responsive QA patch
        run: node scripts/run-final-responsive-qa.mjs

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Build deterministic preview
        run: npm run build:preview

      - name: Run complete quality gate
        run: npm test

      - name: Record dependency audit
        shell: bash
        run: |
          mkdir -p .qa
          npm audit --json > .qa/npm-audit.json || true
          node -e "JSON.parse(require('node:fs').readFileSync('.qa/npm-audit.json','utf8'))"

      - name: Capture final states
        run: node tests/capture-final.mjs

      - name: Verify clean patch
        run: git diff --check

      - name: Publish verified patch
        shell: bash
        run: |
          rm -f .github/workflows/final-responsive-qa.yml scripts/run-final-responsive-qa.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: perfect compact listening layouts"
          git push origin HEAD:rondo-v031-user-ready
