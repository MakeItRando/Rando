name: Rondo user-ready QA

on:
  push:
    branches: [rondo-v031-user-ready]
    paths-ignore:
      - '.qa/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rondo-user-ready-qa
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize diagnostics
        run: |
          mkdir -p .qa
          : > .qa/latest.log
      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: |
          set -o pipefail
          echo '## npm ci' | tee -a .qa/latest.log
          npm ci 2>&1 | tee -a .qa/latest.log
      - name: Install Chromium
        id: chromium
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo '## playwright install' | tee -a .qa/latest.log
          npx playwright install --with-deps chromium 2>&1 | tee -a .qa/latest.log
          node --input-type=module -e "import { chromium } from 'playwright'; console.log('CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Build portable preview
        id: build
        if: steps.chromium.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo '## npm run build:preview' | tee -a .qa/latest.log
          npm run build:preview 2>&1 | tee -a .qa/latest.log
      - name: Start local site
        id: server
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          echo '## local server' | tee -a .qa/latest.log
          python3 -m http.server 4173 > /tmp/rondo-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/preview-test.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rondo-server.log | tee -a .qa/latest.log
          exit 1
      - name: Run full regression suite
        id: regression
        if: steps.server.outcome == 'success'
        continue-on-error: true
        env:
          RONDO_URL: http://127.0.0.1:4173/preview-test.html
        run: |
          set -o pipefail
          echo '## npm test' | tee -a .qa/latest.log
          npm test 2>&1 | tee -a .qa/latest.log
      - name: Publish QA diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .qa/latest.log
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record QA diagnostics [skip ci]'
            git push
          fi
      - name: Report QA failure
        if: always() && steps.regression.outcome != 'success'
        run: exit 1
