name: Final responsive QA

on:
  push:
    branches: [rondo-v031-user-ready]
    paths:
      - .github/workflows/final-responsive-qa.yml
      - scripts/run-final-responsive-qa.mjs

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Locate Chromium
        shell: bash
        run: |
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser" ]; then
            sudo apt-get update
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
            browser="$(command -v chromium || command -v chromium-browser)"
          fi
          test -n "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"

      - name: Run diagnostic quality gate
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          mkdir -p .qa
          set +e
          {
            echo '== APPLY PATCH =='
            node scripts/run-final-responsive-qa.mjs
            echo '== INSTALL =='
            npm ci
            echo '== BUILD =='
            npm run build:preview
            echo '== TEST =='
            npm test
            echo '== AUDIT =='
            npm audit --json > .qa/npm-audit.json || true
            node -e "JSON.parse(require('node:fs').readFileSync('.qa/npm-audit.json','utf8'))"
            echo '== CAPTURE =='
            node tests/capture-final.mjs
            echo '== DIFF CHECK =='
            git diff --check
          } > .qa/final-responsive.log 2>&1
          status=$?
          cat .qa/final-responsive.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git add .qa/final-responsive.log
            git commit -m "chore: capture responsive QA failure" || true
            git push origin HEAD:rondo-v031-user-ready || true
            exit "$status"
          fi
          rm -f .github/workflows/final-responsive-qa.yml scripts/run-final-responsive-qa.mjs .qa/final-responsive.log
          git add -A
          git diff --cached --quiet || git commit -m "fix: perfect compact listening layouts"
          git push origin HEAD:rondo-v031-user-ready
