name: Remove final QA evidence

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .github/workflows/cleanup-final-qa.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
      - name: Remove temporary QA evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .qa
          rm -f .github/workflows/cleanup-final-qa.yml
          test ! -e .qa
          test ! -e .source-export
          test ! -e .qa-transfer
          test ! -e .github/workflows/final-mobile-library-target.yml
          test ! -e .github/workflows/sync-final-preview.yml
          git diff --check
      - name: Publish clean release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove final QA artifacts"
          git push
