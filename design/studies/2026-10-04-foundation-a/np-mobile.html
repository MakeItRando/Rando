<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rondo — Now Playing mobile (design study)</title>
<link rel="stylesheet" href="base.css"><style>
body{width:390px;height:844px;overflow:hidden;position:relative;background:#120a1f}
.amb{position:absolute;inset:0;background:radial-gradient(90% 55% at 30% 18%,rgba(255,61,139,.55),transparent 70%),radial-gradient(80% 50% at 85% 30%,rgba(45,226,230,.28),transparent 70%),linear-gradient(180deg,#2a1240 0%,#120a1f 62%,#0a0a0b 100%)}
.w{position:relative;padding:44px 20px 0;height:100%;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;justify-content:space-between}
.hd .t{text-align:center;font-size:12px;color:rgba(255,255,255,.7)}.hd .t b{display:block;color:#fff;font-size:13.5px;font-weight:600}
.cb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.art{margin:14px 14px 0;width:auto;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.meta h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.meta p{color:rgba(255,255,255,.7);font-size:15px;margin-top:2px}
.meta .hrt{width:44px;height:44px;display:grid;place-items:center;color:var(--brand)}
.scr{margin-top:20px}
.tr{height:4px;border-radius:2px;background:rgba(255,255,255,.22);position:relative}
.tr i{position:absolute;inset:0 62% 0 0;background:#fff;border-radius:2px}
.tr b{position:absolute;left:38%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff}
.tm{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);margin-top:8px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:#fff}
.ctl .ic{width:26px;height:26px}
.ctl .side .ic{width:22px;height:22px;color:rgba(255,255,255,.7)}
.ctl .on .ic{color:var(--brand)}
.pp{width:72px;height:72px;border-radius:50%;background:#fff;color:#0a0a0b;display:grid;place-items:center}
.pp .ic{width:30px;height:30px}
.util{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:rgba(255,255,255,.7);font-size:12.5px}
.util span{display:flex;align-items:center;gap:6px}
.lyr{margin:auto -20px 0;border-radius:18px 18px 0 0;background:rgba(255,255,255,.08);backdrop-filter:blur(20px);padding:10px 24px 28px}
.lyr .h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.lyr p{font-size:19px;font-weight:650;letter-spacing:-.01em;line-height:1.35;margin-top:10px}
.lyr p.dim{color:rgba(255,255,255,.4);margin-top:4px}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);margin:0 auto 10px}
</style></head><body><div class="amb"></div>
<div class="w">
 <div class="hd"><button class="cb" aria-label="Close"><i data-i="down"></i></button><div class="t">Playing from playlist<b>Late drive</b></div><button class="cb" aria-label="More"><i data-i="more"></i></button></div>
 <span class="cover art" data-art="night"></span>
 <div class="meta"><div><h1>Night Transit</h1><p>Kairo Vale, Mira Son</p></div><button class="hrt" aria-label="Liked"><svg class="ic" viewBox="0 0 24 24" style="fill:#ff6b4a;stroke:none;width:26px;height:26px"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></svg></button></div>
 <div class="scr"><div class="tr"><i></i><b></b></div><div class="tm num"><span>1:12</span><span>−1:56</span></div></div>
 <div class="ctl"><span class="side on"><i data-i="shuffle"></i></span><i data-i="prev"></i><span class="pp"><i data-i="pause"></i></span><i data-i="next"></i><span class="side"><i data-i="repeat"></i></span></div>
 <div class="util"><span><i data-i="dev"></i>This phone</span><span><i data-i="share"></i></span><span><i data-i="queue"></i>Up next</span></div>
 <div class="lyr"><div class="grab"></div><div class="h"><span>Lyrics</span><span>Credits · About</span></div><p>Headlights fold into the rain</p><p class="dim">and the city hums in a minor key</p></div>
</div>
<script src="covers.js"></script><script src="icons.js"></script></body></html>
