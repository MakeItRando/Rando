name: Temporary Rondo UX audit

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .qa-trigger

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests and visual audit
        shell: bash
        run: |
          set +e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-compatible browser found" >&2
            exit 1
          fi
          rm -rf .qa-output
          mkdir -p .qa-output/screens
          npm run build:preview > .qa-output/build.log 2>&1
          BUILD_STATUS=$?
          CHROMIUM_PATH="$CHROME" RONDO_URL="file://$PWD/preview-test.html" npm test > .qa-output/tests.log 2>&1
          TEST_STATUS=$?
          CHROMIUM_PATH="$CHROME" RONDO_URL="file://$PWD/preview-test.html" node .qa-temp/visual-audit.mjs > .qa-output/visual.log 2>&1
          VISUAL_STATUS=$?
          mkdir -p .qa-output/previews
          CHROMIUM_PATH="$CHROME" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readdirSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROMIUM_PATH, args: ['--no-sandbox'] });
          for (const name of readdirSync('.qa-output/screens').filter((item) => item.endsWith('.png')).sort()) {
            const page = await browser.newPage();
            await page.goto(pathToFileURL(resolve('.qa-output/screens', name)).href);
            const natural = await page.locator('img').evaluate((image) => ({ width: image.naturalWidth, height: image.naturalHeight }));
            const scale = Math.min(1, 720 / natural.width);
            const width = Math.max(1, Math.round(natural.width * scale));
            const height = Math.max(1, Math.round(natural.height * scale));
            await page.setViewportSize({ width, height });
            await page.evaluate(({ width, height }) => {
              document.documentElement.style.background = '#080a10';
              document.body.style.margin = '0';
              document.body.style.width = `${width}px`;
              document.body.style.height = `${height}px`;
              const image = document.querySelector('img');
              image.style.width = `${width}px`;
              image.style.height = `${height}px`;
              image.style.objectFit = 'fill';
              image.style.margin = '0';
            }, { width, height });
            await page.screenshot({ path: `.qa-output/previews/${name.replace(/\.png$/, '.jpg')}`, type: 'jpeg', quality: 24, animations: 'disabled' });
            await page.close();
          }
          await browser.close();
          NODE
          zip -q .qa-output/previews.zip .qa-output/previews/*.jpg
          printf '{"build":%s,"tests":%s,"visual":%s}\n' "$BUILD_STATUS" "$TEST_STATUS" "$VISUAL_STATUS" > .qa-output/status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .qa-output
          git commit -m "chore: record Rondo UX audit"
          git push
          if [ "$BUILD_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ] || [ "$VISUAL_STATUS" -ne 0 ]; then
            exit 1
          fi
