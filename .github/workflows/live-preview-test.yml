name: Build self-contained v0.3.1 preview

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .live-preview-trigger

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Build portable preview
        shell: bash
        run: |
          set -euo pipefail
          npm run build:preview
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const baseHref = 'https://cdn.jsdelivr.net/gh/MakeItRando/Rando@472b251e85ef4782367b914e3f552c71d5fdf336/';
          const source = readFileSync('preview.html', 'utf8');
          const preview = source.replace('<head>', `<head>\n  <base href="${baseHref}" />`);
          writeFileSync('rondo-v031-preview.html', preview);
          NODE
      - name: Preserve portable preview
        shell: bash
        run: |
          set -euo pipefail
          git add -f rondo-v031-preview.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build v0.3.1 user preview"
          git push
