name: Sync Rondo full-concept preview

on:
  push:
    branches: [rondo-v031-preview]
    paths: [.github/workflows/sync-full-concept-preview.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-preview
          fetch-depth: 0

      - name: Mirror validated source candidate
        run: |
          set -euxo pipefail
          git fetch --no-tags origin rondo-v031-user-ready
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive FETCH_HEAD | tar -x
          test ! -e .concept-transfer
          test ! -e .github/workflows/apply-full-concept.yml
          git diff --check

      - name: Build and validate portable preview
        run: |
          set -euxo pipefail
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run check
          npm run test:unit
          npm run build:preview
          cp preview.html rondo-v031-preview.html
          python3 -m http.server 4173 > /tmp/rondo-preview-server.log 2>&1 &
          echo $! > /tmp/rondo-preview-server.pid
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:4173/rondo-v031-preview.html >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/rondo-v031-preview.html >/dev/null
          RONDO_URL=http://127.0.0.1:4173/rondo-v031-preview.html npm run test:browser
          git diff --check

      - name: Commit clean preview branch
        run: |
          set -euxo pipefail
          rm -rf .preview .qa
          rm -f preview.html preview-test.html preview-*.html
          test -s rondo-v031-preview.html
          test ! -e .github/workflows/sync-full-concept-preview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'chore: publish full-concept preview'
          git push origin HEAD:rondo-v031-preview
