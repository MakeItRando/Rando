name: Prepare Rondo release candidate

on:
  push:
    branches: [rondo-v031-user-ready]
    paths-ignore:
      - '.qa/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rondo-release-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync release metadata and remove generated QA files
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.3.2';
          lock.packages[''].version = '0.3.2';
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          git add package-lock.json
          git rm -r --ignore-unmatch .qa
          if git diff --cached --quiet; then
            echo 'Release metadata and generated files are already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: prepare v0.3.2 release candidate [skip ci]'
          git push
