name: Sync final v0.3.1 preview

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .github/workflows/sync-final-preview.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage final candidate source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rondo-v031-user-ready
          git show origin/rondo-v031-user-ready:.qa/mobile-library.png > /tmp/mobile-library.png
          test "$(wc -c < /tmp/mobile-library.png)" = "61276"
          git rm -r .
          git checkout origin/rondo-v031-user-ready -- .
          rm -rf .qa .source-export
          rm -f .source-combine-trigger .source-export-trigger .source-transfer-trigger
          rm -f .github/workflows/source-combine.yml .github/workflows/source-export.yml .github/workflows/source-transfer.yml
          rm -f .github/workflows/sync-final-preview.yml
      - name: Build and validate portable preview
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:unit
          npm run build:preview
          test -s preview.html
          grep -q 'Pause artist' preview.html
          grep -q 'Inside the track' preview.html
          mv preview.html rondo-v031-preview.html
          rm -rf .preview
          rm -f preview-test.html preview-onboarding.html preview-lyrics.html preview-completion.html preview-library.html preview-profile.html preview-queue.html preview-playing.html preview-reopened.html preview-player.html preview-light.html preview-genre-rnb.html preview-genre-electronic.html preview-genre-jazz.html
      - name: Stage retrievable Library QA transfer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qa-transfer
          base64 -w 0 /tmp/mobile-library.png > /tmp/mobile-library.b64
          cat /tmp/mobile-library.b64 /tmp/mobile-library.b64 /tmp/mobile-library.b64 /tmp/mobile-library.b64 > .qa-transfer/mobile-library.b64x4
          test "$(wc -c < .qa-transfer/mobile-library.b64x4)" -gt 300000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f rondo-v031-preview.html .qa-transfer/mobile-library.b64x4
          git commit -m "chore: stage final preview and Library QA transfer"
          git push
      - name: Publish clean preview branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .qa-transfer
          git commit -m "chore: publish final v0.3.1 preview"
          git push
