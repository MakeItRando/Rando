name: Diagnose Rondo v0.3.1 release

on:
  push:
    branches:
      - rondo-v031-user-ready
    paths:
      - .release-v031/READY

permissions:
  contents: write

jobs:
  diagnose-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: rondo-v031-user-ready
          fetch-depth: 0

      - name: Capture release diagnostics
        shell: bash
        run: |
          set -u
          log=.release-v031/diagnostic.txt
          : > "$log"
          run_step() {
            label="$1"
            shift
            echo "=== $label ===" >> "$log"
            "$@" >> "$log" 2>&1
            code=$?
            echo "exit=$code" >> "$log"
            echo >> "$log"
            return 0
          }
          run_step "reconstruct payload" bash -o pipefail -c 'cat .release-v031/patch.part-* | base64 -d | gzip -d > /tmp/rondo-v031.patch'
          run_step "patch checksum" bash -c 'echo "ebc77be5404edbff5e14d0d5b44aced72effeafa07fda978cb4846321e663044  /tmp/rondo-v031.patch" | sha256sum -c -'
          run_step "patch dry run" git apply --check /tmp/rondo-v031.patch
          run_step "apply patch" git apply /tmp/rondo-v031.patch
          run_step "changed files" git diff --name-status
          run_step "package version" node -p "require('./package.json').version"
          run_step "lock version" node -p "require('./package-lock.json').version"
          run_step "syntax checks" npm run check
          run_step "unit checks" npm run test:unit
          cp "$log" /tmp/rondo-v031-diagnostic.txt
          git reset --hard HEAD
          cp /tmp/rondo-v031-diagnostic.txt "$log"
          git add -f "$log"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Diagnose Rondo v0.3.1 assembly"
          git push origin HEAD:rondo-v031-user-ready
