<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rondo — Playlist mobile (design study)</title>
<link rel="stylesheet" href="base.css"><style>
body{width:390px;height:844px;overflow:hidden;position:relative}
.amb{position:absolute;inset:0 0 auto 0;height:420px;background:linear-gradient(180deg,#123a5e 0%,rgba(10,10,11,0) 100%)}
.w{position:relative;padding:50px 20px 0}
.cb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-left:-10px}
.mosaic{width:210px;height:210px;margin:6px auto 0;display:grid;grid-template-columns:1fr 1fr;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mosaic .cover{border-radius:0;box-shadow:none}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:20px}
.by{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--t2)}
.by .a{width:22px;height:22px;border-radius:50%;background:#3b2a24;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.acts{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--t2)}
.acts .b{width:44px;height:44px;display:grid;place-items:center}
.acts .play{margin-left:auto;width:52px;height:52px}
.acts .shuf{color:var(--brand)}
.add{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 0}
.add .p{width:48px;height:48px;border-radius:8px;background:var(--s2);display:grid;place-items:center}
.add b{font-weight:600}
.t{display:flex;align-items:center;gap:12px;padding:8px 0}
.t .cover{width:48px;height:48px;flex:none;border-radius:6px}
.t div{flex:1;min-width:0}.t b{display:block;font-weight:550;font-size:15px}.t span{font-size:13px;color:var(--t3)}
.t.now b{color:var(--brand)}
.t .m{color:var(--t3)}
.sug{margin-top:14px;padding:14px;border-radius:14px;background:var(--s1)}
.sug .h{display:flex;justify-content:space-between;align-items:center}
.sug .h b{font-size:14px}.sug .h span{font-size:12px;color:var(--t3)}
.sug .t .addb{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px var(--line2) inset;display:grid;place-items:center;color:var(--t1)}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:linear-gradient(180deg,rgba(10,10,11,0),#0a0a0b 30%);display:flex;justify-content:space-around;padding-top:22px;font-size:11px;color:var(--t3)}
.tab span{display:flex;flex-direction:column;align-items:center;gap:4px}.tab .on{color:var(--t1)}
.mini{position:absolute;left:8px;right:8px;bottom:84px;height:56px;border-radius:10px;background:#3a1d4f;display:flex;align-items:center;gap:10px;padding:0 8px;overflow:hidden}
.mini .cover{width:40px;height:40px;flex:none;border-radius:6px}.mini b{font-size:13.5px;font-weight:600;display:block}.mini span{font-size:12px;color:rgba(255,255,255,.65)}
.mini .r{margin-left:auto;display:flex;gap:4px}.mini .r i,.mini .r svg{width:24px;height:24px}
.mini .r>*{width:40px;height:40px;display:grid;place-items:center}
.mini .pr{position:absolute;left:8px;right:8px;bottom:0;height:2px;background:rgba(255,255,255,.2)}.mini .pr i{position:absolute;inset:0 62% 0 0;background:#fff}
</style></head><body><div class="amb"></div>
<div class="w">
 <button class="cb" aria-label="Back"><i data-i="back"></i></button>
 <div class="mosaic"><span class="cover" data-art="night"></span><span class="cover" data-art="open"></span><span class="cover" data-art="blue"></span><span class="cover" data-art="small"></span></div>
 <h1>Late drive</h1>
 <div class="by"><span class="a">M</span>Mikoto<span class="dot"></span>23 songs, 1 hr 14 min</div>
 <div class="acts"><span class="b"><i data-i="plus"></i></span><span class="b"><i data-i="share"></i></span><span class="b"><i data-i="more"></i></span><span class="b shuf"><i data-i="shuffle"></i></span><span class="play"><i data-i="pause"></i></span></div>
 <div class="t now"><span class="cover" data-art="night"></span><div><b>Night Transit</b><span>Kairo Vale, Mira Son</span></div><span class="m"><i data-i="more"></i></span></div>
 <div class="t"><span class="cover" data-art="open"></span><div><b>Open Circuit</b><span>Vale &amp; Lio</span></div><span class="m"><i data-i="more"></i></span></div>
 <div class="t"><span class="cover" data-art="blue"></span><div><b>Blue Hour</b><span>Nia Vale</span></div><span class="m"><i data-i="more"></i></span></div>
 <div class="sug"><div class="h"><b>Fits this playlist</b><span>Based on its songs</span></div>
  <div class="t"><span class="cover" data-art="small"></span><div><b>Small Hours</b><span>Moni Gray</span></div><span class="addb"><i data-i="plus"></i></span></div></div>
</div>
<div class="mini"><span class="cover" data-art="night"></span><div><b>Night Transit</b><span>Kairo Vale, Mira Son</span></div><div class="r"><span><i data-i="dev"></i></span><span><i data-i="pause"></i></span></div><div class="pr"><i></i></div></div>
<nav class="tab"><span><i data-i="home"></i>Home</span><span><i data-i="search"></i>Search</span><span><i data-i="journey"></i>Journeys</span><span class="on"><i data-i="lib"></i>Library</span></nav>
<script src="covers.js"></script><script src="icons.js"></script></body></html>
