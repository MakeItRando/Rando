name: Export concept source

on:
  push:
    branches:
      - rondo-v031-preview
    paths:
      - .github/workflows/export-concept-source.yml

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Stage retrievable source transfer
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/rondo-concept-source.tgz \
            README.md package.json package-lock.json index.html app.js \
            styles.css listening.css song-room.css scripts src tests docs
          mkdir -p .source-transfer
          base64 -w 0 /tmp/rondo-concept-source.tgz > /tmp/rondo-concept-source.b64
          cat /tmp/rondo-concept-source.b64 /tmp/rondo-concept-source.b64 /tmp/rondo-concept-source.b64 /tmp/rondo-concept-source.b64 > .source-transfer/rondo-concept-source.b64x4
          test "$(wc -c < .source-transfer/rondo-concept-source.b64x4)" -gt 100000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .source-transfer/rondo-concept-source.b64x4
          git commit -m "chore: stage concept source transfer"
          git push
      - name: Restore clean preview branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .source-transfer
          git rm .github/workflows/export-concept-source.yml
          git commit -m "chore: clean concept source transfer"
          git push
